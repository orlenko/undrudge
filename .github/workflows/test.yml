name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
